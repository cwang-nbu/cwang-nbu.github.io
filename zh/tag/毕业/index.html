<script>
  (function() {
    var storageKey = 'siteTheme';
    var versionKey = 'siteThemeVersion';
    var themeVersion = '2';
    var mediaQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

    function getMode() {
      if (localStorage.getItem(versionKey) !== themeVersion) {
        localStorage.setItem(versionKey, themeVersion);
        localStorage.setItem(storageKey, 'auto');
        localStorage.removeItem('wcTheme');
        return 'auto';
      }
      return localStorage.getItem(storageKey) || 'auto';
    }

    function shouldUseDark(mode) {
      if (mode === 'dark') {
        return true;
      }
      if (mode === 'light') {
        return false;
      }
      return mediaQuery && mediaQuery.matches;
    }

    function applyTheme(mode) {
      var useDark = shouldUseDark(mode);
      document.body.classList.toggle('dark', useDark);
      localStorage.setItem(storageKey, mode);
      localStorage.setItem(versionKey, themeVersion);
      localStorage.removeItem('wcTheme');

      document.querySelectorAll('[data-site-theme]').forEach(function(item) {
        item.classList.toggle('dropdown-item-active', item.getAttribute('data-site-theme') === mode);
      });

      document.dispatchEvent(new CustomEvent('wcThemeChange', {detail: {isDarkTheme: function() { return useDark; }}}));
    }

    function setTheme(mode) {
      applyTheme(mode);
    }

    function ensureThemeMenu() {
      var navIcons = document.querySelector('#navbar-main .nav-icons');
      if (!navIcons || document.querySelector('.site-theme-dropdown')) {
        return;
      }

      var item = document.createElement('li');
      item.className = 'nav-item dropdown site-theme-dropdown';
      item.innerHTML = [
        '<a href="#" class="nav-link" data-toggle="dropdown" aria-haspopup="true" aria-label="显示偏好">',
        '<svg class="nav-icon-svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.5 6.5 0 0 0 21 12.8Z"></path></svg>',
        '</a>',
        '<div class="dropdown-menu">',
        '<a href="#" class="dropdown-item" data-site-theme="light"><span>浅色</span></a>',
        '<a href="#" class="dropdown-item" data-site-theme="dark"><span>深色</span></a>',
        '<a href="#" class="dropdown-item" data-site-theme="auto"><span>自动</span></a>',
        '</div>'
      ].join('');
      navIcons.insertBefore(item, navIcons.firstChild);
    }

    ensureThemeMenu();
    applyTheme(getMode());

    document.addEventListener('siteThemeRequest', function(event) {
      applyTheme(event.detail && event.detail.mode ? event.detail.mode : 'auto');
    });

    document.addEventListener('click', function(event) {
      var control = event.target.closest('[data-site-theme]');
      if (!control) {
        return;
      }
      event.preventDefault();
      setTheme(control.getAttribute('data-site-theme'));
    });

    if (mediaQuery) {
      mediaQuery.addEventListener('change', function() {
        if (getMode() === 'auto') {
          applyTheme('auto');
        }
      });
    }
  })();
</script>
